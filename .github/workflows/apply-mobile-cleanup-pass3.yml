name: Apply VIP mobile cleanup pass 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-cleanup-pass3.yml'
      - 'scripts/apply_mobile_cleanup_pass3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply mobile cleanup pass 3
        run: python3 scripts/apply_mobile_cleanup_pass3.py

      - name: Commit updated pages
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '*/index.html'
          git commit -m "Refine VIP mobile hero and logo periods [mobile-pass-3]"
          git push
